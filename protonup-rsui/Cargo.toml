[package]
name = "protonup-rsui"
version = "1.0.0-rc2"
edition = "2024"
authors = ["Rafael Passos <auyer@rcpassos.me>"]
repository = "https://github.com/auyer/protonup-rs"
license = "GPL-3.0"
readme = "../README.md"

description = "A Rust GUI app to automate the installation and update of Linux Gaming Compatibility tools, like ProtonGE, Luxtorpeda, Boxtron and others"

[package.metadata.deb]
maintainer = "Rafael Passos <auyer@rcpassos.me>"
copyright = "2024, Rafael Passos <auyer@rcpassos.me>"
extended-description = "A Rust GUI app to automate the installation and update of Linux Gaming Compatibility tools, like ProtonGE, Luxtorpeda, Boxtron and others"
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/protonup-rsui", "usr/bin/", "755"],
    ["../README.md", "usr/share/doc/protonup-rsui/README", "644"],
    ["protonup-rsui.desktop", "usr/share/applications/", "644"],
    ["assets/protonup-rs-logo_512.png", "usr/share/icons/hicolor/512x512/apps/protonup-rsui.png", "644"],
    ["assets/protonup-rs-logo_256.png", "usr/share/icons/hicolor/256x256/apps/protonup-rsui.png", "644"],
    ["assets/protonup-rs-logo.png", "usr/share/pixmaps/protonup-rsui.png", "644"],
]

[dependencies]

iced = { version = "0.14", features = ["tokio", "sipper", "image", "canvas", "advanced"] }
iced_futures = { version = "0.14", features = ["tokio"] }
libprotonup = { path = "../libprotonup", version = "1.0.0-rc2" }
lyon_algorithms = "1.0"
rfd = "0.17"

tokio = { version = "1.54", features = ["sync"] }
futures-util = "0.3"
anyhow = "1.0"

[dev-dependencies]
iced_test = "0.14"
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "rt"] }
tempfile = "3"
